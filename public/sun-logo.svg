<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Sun Rays & Glow -->
  <circle cx="50" cy="50" r="42" stroke="url(#sunGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="50" cy="50" r="26" fill="url(#sunGrad)" filter="url(#glow)" />
  
  <!-- Green Energy Leaf overlay -->
  <path d="M50 26 C64 26 74 38 72 56 C70 70 54 78 50 78 C46 78 30 70 28 56 C26 38 36 26 50 26 Z" fill="url(#leafGrad)" opacity="0.9" />
  <path d="M50 30 L50 74" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M50 44 Q58 40 64 42" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M50 54 Q42 50 36 52" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M50 62 Q56 58 61 60" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Star accents -->
  <polygon points="50,6 52,14 60,14 53,19 56,27 50,22 44,27 47,19 40,14 48,14" fill="#FBBF24" />
</svg>
